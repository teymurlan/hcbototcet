name: v17-check
on:
  push:
    branches: [v17-admin-control]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save typescript
      - run: npx tsc -p tsconfig.json --noEmit
