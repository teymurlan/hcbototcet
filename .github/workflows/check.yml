name: Check HOUSE CLEANING bot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --test tests/staff-final-contract.test.mjs
      - run: npx wrangler deploy --dry-run --outdir /tmp/hc-worker-build
