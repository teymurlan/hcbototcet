name: Check HOUSE CLEANING bot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --test tests/staff-final-contract.test.mjs tests/staff-runtime-operations.test.mjs tests/staff-current-stability.test.mjs tests/staff-parallel-reports.test.mjs tests/staff-operations-safe.test.mjs tests/staff-admin-access.test.mjs tests/staff-defects-performance.test.mjs tests/staff-mira-style.test.mjs tests/staff-human-orders.test.mjs tests/staff-clients.test.mjs tests/staff-catalog-design.test.mjs tests/staff-catalog-cabinets.test.mjs tests/staff-command-v3.test.mjs tests/staff-command-v4.test.mjs
      - run: npx wrangler deploy --dry-run --outdir /tmp/hc-worker-build
